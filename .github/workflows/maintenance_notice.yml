name: One-Time Telegram Maintenance Notice

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/maintenance_notice.yml'

permissions:
  contents: read

jobs:
  notify:
    name: Notify Telegram channel
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send one-time maintenance announcement
        env:
          ENV_JSON: ${{ secrets.ENV_JSON }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          try:
              cfg = json.loads(os.environ.get("ENV_JSON", "{}"))
              token = cfg["TELEGRAM_TOKEN"]
              chat_id = cfg["TELEGRAM_CHAT_ID"]
              message = (
                  "📢 [투자 블로그 요약 서비스 일시 중단 안내]\n\n"
                  "Google Gemini API 결제 오류(선불 크레딧 문제)로 인해 "
                  "투자 블로그 AI 요약 및 Telegram 자동 발송을 당분간 중단합니다.\n\n"
                  "결제 문제를 해결하고 정상 작동을 검증한 후 운영을 재개하겠습니다.\n"
                  "이용에 양해 부탁드립니다."
              )
              payload = json.dumps(
                  {"chat_id": chat_id, "text": message},
                  ensure_ascii=False
              ).encode("utf-8")
              request = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data=payload,
                  headers={"Content-Type": "application/json"},
                  method="POST"
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  result = json.load(response)
              if not result.get("ok"):
                  raise RuntimeError("Telegram returned ok=false")
          except Exception:
              print("Maintenance notice was not delivered; check bot credentials and target.", file=sys.stderr)
              sys.exit(1)
          print("Maintenance notice delivered to configured Telegram chat.")
          PY
