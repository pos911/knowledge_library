name: Daily AI Investment Summary

# Github Actions 실행 스케줄 설정
on:
  schedule:
    # 07:00 KST = 22:00 UTC (이전 날짜)
    # 평일(Mon-Fri) 오전 7시 동작을 위해 UTC 기준 일요일~목요일 22:00 실행
    - cron: '0 22 * * 0-4'
    
    # 10:00 KST = 01:00 UTC
    # 주말(Sat-Sun) 오전 10시 동작을 위해 UTC 기준 토요일, 일요일 01:00 실행
    - cron: '0 1 * * 5-6'
    
  # 수동으로 언제든 테스트 실행할 수 있는 버튼 활성화
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v3

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: 4. Run the Pipeline Script
        env:
          # 여기서 아까 등록하신 단일 JSON Secret을 통째로 넘겨줍니다.
          ENV_JSON: ${{ secrets.ENV_JSON }}
        run: |
          # main.py에서 schedule 라이브러리 없이 즉시 1회 실행하도록 강제 옵션 추가
          # (스케줄러는 서버용이므로 GitHub Actions에서는 스크립트를 1회성으로 바로 실행해야 합니다)
          python -c "import main; main.run_pipeline()"
          
      - name: 5. Commit & Push Updated DB
        # 스크래핑된 게시물 ID가 저장된 knowledge.db 파일을 저장소에 업데이트해야
        # 내일 실행될 때 중복 뉴스와 요약이 안 보내집니다.
        # 이 단계에 사용될 개인 액세스 토큰은 ENV_JSON 내부의 GH_PAT를 사용합니다.
        env:
          GH_PAT: ${{ fromJson(secrets.ENV_JSON).GH_PAT }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add knowledge.db
          
          # 변경사항이 있을 경우에만 커밋 및 푸시
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-update DB after daily summary run [skip ci]"
            # GH_PAT를 사용하여 권한 확보 및 푸시
            git push https://$GH_PAT@github.com/${{ github.repository }}.git HEAD:main
          else
            echo "No database changes to commit."
          fi
