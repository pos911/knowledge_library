name: Daily AI Investment Summary

on:
  schedule:
    # 평일(Mon-Fri) 07:00 KST = 22:00 UTC (전날)
    - cron: '0 22 * * 0-4'
    # 주말(Sat-Sun) 10:00 KST = 01:00 UTC
    - cron: '0 1 * * 5-6'
  # 수동 실행 버튼 활성화
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    # 스크래핑/API 호출 hang 방지를 위한 타임아웃 (분)
    timeout-minutes: 15

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Run the Pipeline Script
        env:
          # ENV_JSON: GitHub Secrets에 등록된 단일 JSON 시크릿
          # 포함 필수 키: GEMINI_API_KEY, TELEGRAM_TOKEN, TELEGRAM_CHAT_ID, GH_PAT
          ENV_JSON: ${{ secrets.ENV_JSON }}
          # GITHUB_ACTIONS=true 는 GitHub Actions runner에서 자동으로 주입됨
          # main.py의 __main__ 블록이 이 값을 감지하여 1회 실행 후 종료함
        run: |
          python main.py

      - name: 5. Commit & Push Updated DB
        env:
          GH_PAT: ${{ fromJson(secrets.ENV_JSON).GH_PAT }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f knowledge.db

          # 변경사항이 있을 경우에만 커밋 및 푸시
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-update DB after daily summary run [skip ci]"
            git push https://$GH_PAT@github.com/${{ github.repository }}.git HEAD:main
          else
            echo "No database changes to commit."
          fi
